name: Build_JDCloud_AX3000

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'  # 每周一 UTC 00:00 自动构建

env:
  DEBIAN_FRONTEND: noninteractive
  DEVICE_NAME: JDCloud_AX3000
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: devices/JDCloud_AX3000/JDCloud_AX3000.config
  TARGET_BOARD: qualcommax
  TARGET_SUBTARGET: ipq50xx
  RELEASE_TAG: JDCloud_AX3000

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@master

    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Install build dependencies
      run: |
        sudo apt update -y
        sudo apt full-upgrade -y
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison \
          build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
          gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool \
          libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
          libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build p7zip \
          p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools \
          qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo apt -y autoremove --purge
        sudo apt clean

    - name: Clone source code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cp devices/$DEVICE_NAME/customize.sh openwrt/
        cp devices/$DEVICE_NAME/*.patch openwrt/ 2>/dev/null || true
        cd openwrt && chmod +x customize.sh && ./customize.sh

    - name: Update & Install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configuration Customization - Build_JDCloud_AX3000
      run: |
        [ -e $CONFIG_FILE ] || { echo "ERROR: $CONFIG_FILE not found"; exit 1; }
        mv $CONFIG_FILE openwrt/.config
        chmod +x ./customize.sh && ./customize.sh
        cd openwrt && make defconfig

    - name: Download package
      working-directory: ./openwrt
      run: |
        make download -j$(nproc)

    - name: Build firmware
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread build."
        yes "" | make -j$(nproc) V=s

    - name: Upload artifact
      uses: actions/upload-artifact@master
      with:
        name: OpenWrt
        path: openwrt/bin

    - name: Upload to Release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ env.RELEASE_TAG }}
        files: openwrt/bin/targets/${{ env.TARGET_BOARD }}/${{ env.TARGET_SUBTARGET }}/*
        body: |
          JDCloud AX3000 OpenWrt 固件
          - 架构: qualcommax / ipq50xx
          - 自动每周构建
