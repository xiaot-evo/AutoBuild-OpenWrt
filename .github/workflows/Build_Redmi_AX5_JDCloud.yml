name: Build_Redmi_AX5_JDCloud

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'  # 每周一 UTC 00:00 自动构建

env:
  DEBIAN_FRONTEND: noninteractive
  DEVICE_NAME: Redmi_AX5_JDCloud
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  REPO_BRANCH: 25.12-nss
  CONFIG_FILE: devices/Redmi_AX5_JDCloud/Redmi_AX5_JDCloud.config
  TARGET_BOARD: qualcommax
  TARGET_SUBTARGET: ipq60xx
  RELEASE_TAG: Redmi_AX5_JDCloud

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@master

    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Install build dependencies
      run: |
        sudo -E apt-get update
        sudo -E apt-get -y install \
          aria2 asciidoc autoconf automake autopoint bc binutils bison \
          build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
          fastjar file flex g++ gawk gcc-multilib g++-multilib gettext git \
          help2man intltool jq libelf-dev libssl-dev libtool ninja-build \
          patch pkgconf python3 python3-pyelftools python3-setuptools \
          qemu-utils rsync squashfs-tools subversion swig texinfo time \
          uglifyjs unzip vim wget xmlto xxd xz-utils zlib1g-dev zstd
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get clean

    - name: Clone source code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cp devices/$DEVICE_NAME/customize.sh openwrt/
        cd openwrt && chmod +x customize.sh && ./customize.sh

    - name: Update & Install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configuration Customization - Build_Redmi_AX5_JDCloud
      run: |
        [ -e $CONFIG_FILE ] || { echo "ERROR: $CONFIG_FILE not found"; exit 1; }
        mv $CONFIG_FILE openwrt/.config
        chmod +x ./customize.sh && ./customize.sh
        cd openwrt && make defconfig

    - name: Download package
      working-directory: ./openwrt
      run: |
        make download -j$(nproc)

    - name: Build firmware
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread build."
        yes "" | make -j$(nproc) V=s

    - name: Upload artifact
      uses: actions/upload-artifact@master
      with:
        name: OpenWrt
        path: openwrt/bin

    - name: Upload to Release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ env.RELEASE_TAG }}
        files: openwrt/bin/targets/${{ env.TARGET_BOARD }}/${{ env.TARGET_SUBTARGET }}/*
        body: |
          Redmi AX5 JDCloud OpenWrt 固件
          - 架构: qualcommax / ipq60xx
          - 自动每周构建
